name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Chạy script đánh thức Streamlit
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: python ping.py
